        <div class="contact-column">
          <form action="form-handler.php" method="post">
            <input
              type="text"
              name="firstName"
              placeholder="First Name"
              required
            />
            <input
              type="text"
              name="lastName"
              placeholder="Last Name"
              required
            />
            <input
              type="email"
              name="visitor_email"
              placeholder="Email"
              required
            />
            <textarea
              rows="8"
              name="message"
              placeholder="Type your message here"
              required
            ></textarea>
            <button type="submit" class="hero-button">Send Message</button>
          </form>
        </div>
      </div>
